<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SELECT — Module 2 Feedback QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    :root {
      --plum: #5B2245; --magenta: #C4467E; --blush: #EFE6ED; --blush-2: #F7F2F4;
      --ink: #2a2228; --ts: #6b6068; --line: #e6dce3;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--blush-2);
      color: var(--ink); margin: 0; padding: 32px 16px; }
    .panel { max-width: 560px; margin: 0 auto 24px; background: #fff;
      border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    h1 { color: var(--plum); font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--ts); font-size: 14px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: bold; color: var(--plum); margin: 0 0 6px; }
    input[type=text] { width: 100%; font-size: 15px; font-family: inherit; padding: 12px 14px;
      border: 1.5px solid var(--line); border-radius: 10px; background: var(--blush-2); }
    .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button { background: var(--plum); color: #fff; border: none; border-radius: 10px;
      padding: 12px 18px; font-size: 14.5px; font-weight: bold; cursor: pointer; }
    button.ghost { background: #fff; color: var(--plum); border: 1.5px solid var(--plum); }
    .card-area { display: flex; justify-content: center; }
    #card {
      width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 32px 24px; text-align: center;
    }
    .brand { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--magenta);
      font-weight: bold; margin: 0 0 6px; }
    .card-title { font-size: 22px; font-weight: bold; color: var(--plum); margin: 0 0 6px; }
    .card-sub { font-size: 13.5px; color: var(--ts); margin: 0 0 20px; }
    .qbox { display: flex; justify-content: center; margin-bottom: 18px; }
    .scan { font-size: 12.5px; color: var(--ts); margin: 0; }
    .foot { font-size: 10.5px; letter-spacing: .5px; color: #b7a8b3; margin: 18px 0 0; }
    @media print {
      body { background: #fff; padding: 0; }
      .panel, .sub, h1 { display: none; }
      .card-area { margin-top: 40px; }
      #card { border: none; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Module 2 Feedback — QR card</h1>
    <p class="sub">Paste the live form URL, generate, then print the card or download it as a PNG for a slide or email.</p>
    <label for="url">Live form URL</label>
    <input type="text" id="url" value="https://select-programme.netlify.app/module2-feedback" />
    <div class="row">
      <button onclick="generate()">Generate</button>
      <button class="ghost" onclick="window.print()">Print card</button>
      <button class="ghost" onclick="downloadPNG()">Download PNG</button>
    </div>
  </div>

  <div class="card-area">
    <div id="card">
      <p class="brand">SELECT Programme</p>
      <div class="card-title">Module 2 Feedback</div>
      <p class="card-sub">Two minutes to tell us how today landed.</p>
      <div class="qbox"><canvas id="qr"></canvas></div>
      <p class="scan">Scan with your phone camera to open the form.</p>
      <p class="foot">UNRAVEL COMPLEXITY · FOR INTERTRADEIRELAND</p>
    </div>
  </div>

  <script>
    var qr = new QRious({
      element: document.getElementById('qr'),
      size: 220,
      level: 'H',
      foreground: '#5B2245',
      background: '#ffffff'
    });

    function generate() {
      var url = document.getElementById('url').value.trim();
      if (!url) { alert('Please paste the live form URL first.'); return; }
      qr.value = url;
    }

    function downloadPNG() {
      generate();
      var canvas = document.getElementById('qr');
      var link = document.createElement('a');
      link.download = 'SELECT_Module2_Feedback_QR.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Render on load with the prefilled URL
    generate();
  </script>
</body>
</html>
