[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# FIXED 28/07/2026: this pointed at "airtable" (netlify/functions/airtable.js,
# last updated a month ago), so the maintained function airtable-api.js was
# never invoked. Every save hit the stale function.
[[redirects]]
  from = "/api/airtable"
  to = "/.netlify/functions/airtable-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/submit-baseline"
  to = "/.netlify/functions/submit-baseline"
  status = 200
  force = true

[[headers]]
  for = "/tracker.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/airtable-data.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
