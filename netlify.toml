[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/airtable"
  to = "/.netlify/functions/airtable"
  status = 200
  force = true

[[redirects]]
  from = "/api/submit-baseline"
  to = "/.netlify/functions/submit-baseline"
  status = 200
  force = true

[[headers]]
  for = "/tracker.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/airtable-data.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
